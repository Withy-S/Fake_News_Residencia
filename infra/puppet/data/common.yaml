---
lookup_options:
  fakenews::grafana_admin_password:
    convert_to: "Sensitive"

fakenews::repo_url: "https://github.com/Withy-S/Fake_News_Residencia.git"
fakenews::branch: "main"
fakenews::install_dir: "/opt/fakenews"

# Placeholder: defina a senha real em data/secrets.yaml (ver secrets.yaml.example).
fakenews::grafana_admin_password: "admin"

# Regras liberadas no ufw (formato do "ufw allow"). Sem OpenSSH a máquina fica trancada.
fakenews::firewall_allow:
  - "OpenSSH"

# Auto-cura: reinicia a stack depois de N falhas seguidas (uma checagem por minuto).
fakenews::healthcheck_url: "http://127.0.0.1:8000/api/v1/health"
fakenews::healthcheck_max_failures: 3

# Vira o backend/.env (mesmos valores do backend/.env.example).
fakenews::api_env:
  FN_MIN_TEXT_LENGTH: "20"
  FN_MIN_CONFIDENCE: "0.6"
  FN_CLASSIFIER: "stacking"
  FN_STACKING_MODEL_PATH: "models/stacking.joblib"
  FN_FALLBACK_METHOD: "ai_fallback"
  FN_TRUSTED_DOMAINS: "[]"
  FN_REQUEST_TIMEOUT_SECONDS: "10"
  FN_ALLOWED_ORIGINS: "[]"
